<!doctype html><html><head><meta charset="utf-8"></head><body>
<button id="run" style="position:fixed;z-index:9999;bottom:0;left:0">執行版面診斷</button>
<pre id="report" style="position:fixed;z-index:9999;bottom:0;right:0;background:white;color:black;font-size:11px;max-height:40vh;overflow:auto"></pre>
<script type="module">
import '../src/style.css';
import '@xterm/xterm/css/xterm.css';
import { TermixApp } from '../src/App.js';
import { terminalStore } from '../src/modules/terminal/TerminalStore.js';
import { TerminalAPI } from '../src/modules/terminal/TerminalAPI.js';
import '../src/modules/terminal/TerminalPage.js';
const params = new URLSearchParams(location.search);
document.documentElement.style.setProperty('--ui-scale', params.get('scale') || '1');
TerminalAPI.resizeTerminal = async () => {};
TerminalAPI.writeTerminalInput = async () => {};
terminalStore.setState({activeWorkspaceId:'diagnostic',activePaneSessionKey:'diagnostic',
  sessions:{diagnostic:{label:'版面診斷',config:{},isLocal:true}},
  workspaces:[{id:'diagnostic',label:'版面診斷',columns:[{width:100,panes:[{sessionKey:'diagnostic',height:100}]}]}]});
class DiagnosticApp extends TermixApp {
  connectedCallback() {
    this.render();
    this.setupSidebarListeners();
    this.querySelector('#outlet').append(document.createElement('terminal-page'));
  }
  renderSidebarComponents() {}
}
customElements.define('diagnostic-app', DiagnosticApp);
document.body.append(document.createElement('diagnostic-app'));
const wait = () => new Promise(resolve => setTimeout(resolve, 650));
const results = [];
function measure(stage) {
  const pane = document.querySelector('.terminal-pane');
  const container = document.querySelector('.xterm-pane-container');
  const screen = document.querySelector('.xterm-screen');
  const term = terminalStore.getState().xtermInstances.diagnostic;
  const pr = pane.getBoundingClientRect();
  const cr = container.getBoundingClientRect();
  const sr = screen.getBoundingClientRect();
  const canvas = screen.querySelector('canvas');
  const render = canvas ? canvas.getBoundingClientRect() : sr;
  return {stage,scale:params.get('scale')||'1',cols:term.cols,rows:term.rows,
    paneWidth:pr.width,containerWidth:cr.width,screenWidth:sr.width,
    rightOverflow:Math.max(0,render.right-pr.right),bottomOverflow:Math.max(0,render.bottom-pr.bottom),
    viewportOverflow:Math.max(0,render.right-innerWidth)};
}
document.querySelector('#run').onclick = async () => {
  document.querySelector('#run').disabled = true;
  document.querySelector('#report').removeAttribute('data-status');
  results.length=0;
  const term = terminalStore.getState().xtermInstances.diagnostic;
  await new Promise(resolve => term.write(('0123456789'.repeat(40)+'\r\n').repeat(8),resolve));
  await wait(); results.push(measure('初始'));
  for (let cycle = 1; cycle <= 3; cycle++) {
    document.querySelector('#toggleControlSidebar').click();
    await wait(); results.push(measure(`開啟 ${cycle}`));
    document.querySelector('#toggleControlSidebar').click();
    await wait(); results.push(measure(`關閉 ${cycle}`));
  }
  const failed = results.some(r=>r.rightOverflow>1||r.bottomOverflow>1||r.viewportOverflow>1);
  document.querySelector('#report').textContent = JSON.stringify({status:failed?'FAIL':'PASS',results},null,2);
  document.querySelector('#report').dataset.status = failed ? 'FAIL' : 'PASS';
  document.querySelector('#run').disabled = false;
};
</script></body></html>
